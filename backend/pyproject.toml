[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | diff_logs
  | temp
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".venv", "diff_logs", "temp"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting (isort-compatible)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["B008"]  # FastAPI Depends/File/Query in defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]
